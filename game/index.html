<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramble Word Hunt | Workshop Logika Pemrograman</title>
  <meta name="description" content="Game susun kata sederhana berbasis web untuk melatih logika pemrograman dengan HTML, CSS, dan JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <h1 class="game-title">Word Hunt</h1>
      <p class="game-subtitle">Susun kata sesuai KBBI sebanyak mungkin dari huruf yang tersedia</p>
    </header>

    <!-- Layar 1: Pengaturan Awal -->
    <section id="setup-screen" class="card">
      <div class="form-group">
        <label for="round-select" class="form-label">Pilih Ronde Permainan</label>
        <select id="round-select" class="form-select"></select>
      </div>

      <button id="start-button" class="btn btn-primary" type="button">Mulai Main</button>
      <p id="setup-message" class="feedback-text" role="status"></p>
    </section>

    <!-- Layar 2: Arena Permainan -->
    <section id="game-screen" class="card" hidden>
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">Ronde</span>
          <strong id="round-text" class="stat-value">1/3</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">Skor</span>
          <strong id="score-text" class="stat-value">0</strong>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ditemukan</span>
          <strong id="progress-text" class="stat-value">0/10</strong>
        </div>
      </div>

      <!-- Area susunan huruf yang sedang ditebak -->
      <div class="answer-section">
        <span class="section-label">Susunan Kata Kamu:</span>
        <div id="answer-slots" class="tiles-row answer-row" aria-label="Huruf yang tersusun"></div>
        <p class="hint-text">Ketuk huruf di bawah untuk menyusun. Ketuk di atas untuk melepas.</p>
      </div>

      <!-- Kumpulan huruf yang tersedia di ronde ini -->
      <div class="letters-section">
        <span class="section-label">Pilihan Huruf:</span>
        <div id="tiles" class="tiles-row letters-row" aria-label="Huruf yang tersedia"></div>
      </div>

      <p id="feedback" class="feedback-text" role="status"></p>

      <!-- Tombol kendali permainan -->
      <div class="actions-grid">
        <button id="check-button" class="btn btn-primary btn-large" type="button">Kirim Kata</button>
        <button id="shuffle-button" class="btn btn-secondary" type="button">Acak Huruf</button>
        <button id="clear-button" class="btn btn-secondary" type="button">Hapus</button>
        <button id="skip-button" class="btn btn-secondary" type="button">Lanjut Ronde</button>
      </div>

      <!-- Daftar kata target yang harus ditemukan -->
      <div class="target-section">
        <span class="section-label">Target Kata Ronde Ini:</span>
        <div id="words-grid" class="words-grid" aria-label="Daftar kata yang harus ditemukan"></div>
      </div>
    </section>

    <!-- Layar 3: Ringkasan Hasil -->
    <section id="result-screen" class="card" hidden>
      <h2 class="result-title">Permainan Selesai!</h2>
      <div class="result-box">
        <span class="stat-label">Total Skor Akhir</span>
        <strong id="final-score" class="result-score">0</strong>
      </div>
      <p id="final-note" class="result-note"></p>
      <button id="restart-button" class="btn btn-primary" type="button">Main Lagi</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
